
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Admin - SCIENOVA</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="logo">SCIENOVA ADMIN</div><a href="/">Home</a></header>
<div id="loginBox" style="max-width:400px;margin:50px auto;text-align:center">
<h2>Admin Login</h2><input id="adminPass" type="password" placeholder="Password"><button id="adminLoginBtn">Login</button><p id="adminMsg"></p>
</div>
<div id="adminPanel" style="display:none; padding:20px">
<h2>Upload Resources</h2>
<input type="file" id="fileInput"><button id="uploadBtn">Upload</button><p id="uploadMsg"></p>

<h2>Payments / Subscriptions</h2>
<div id="payments"></div>

<h2>Contributor Pending Papers</h2>
<div id="pending"></div>

<h2>All Resources</h2>
<div id="allRes"></div>
</div>
<script>
const PASS='SCIENOVA2026';
document.getElementById('adminLoginBtn').onclick=()=>{
  if(document.getElementById('adminPass').value===PASS){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    loadPayments(); loadPending(); loadRes();
  }else{document.getElementById('adminMsg').textContent='Wrong password';}
};
document.getElementById('uploadBtn').onclick=async()=>{
  const f=document.getElementById('fileInput').files[0];
  if(!f) return;
  const fd=new FormData(); fd.append('file',f);
  const res=await fetch('/api/upload',{method:'POST',body:fd});
  const d=await res.json();
  document.getElementById('uploadMsg').textContent=d.success?'Uploaded!':'Failed';
  loadRes();
};
async function loadPayments(){
  const res=await fetch('/api/payments'); const data=await res.json();
  document.getElementById('payments').innerHTML = data.map(p=>`<div class="card"><b>${p.email}</b> - ${p.plan} - ${p.transactionId} - Expiry: ${new Date(p.expiry).toLocaleDateString()} - ${new Date(p.createdAt).toLocaleString()}</div>`).join('') || 'No payments yet';
}
async function loadPending(){
  const res=await fetch('/api/contributions'); const data=await res.json();
  const pend=data.filter(c=>c.status==='pending');
  document.getElementById('pending').innerHTML = pend.map(c=>`<div class="card"><b>${c.originalName}</b> by ${c.email} (${c.subject})<br>${c.description}<br><button onclick="approve('${c.id}')">Approve</button> <a href="/uploads/pending/${c.filename}" target="_blank">View</a></div>`).join('') || 'No pending';
}
async function loadRes(){
  const res=await fetch('/api/resources'); const data=await res.json();
  document.getElementById('allRes').innerHTML = data.map(r=>`<div class="card"><a href="${r.url}" target="_blank">${r.filename}</a></div>`).join('');
}
async function approve(id){
  await fetch('/api/approve-contribution',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  loadPending(); loadRes();
}
</script>
</body>
</html>
