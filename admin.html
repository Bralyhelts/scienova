<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>SCIENOVA SECRET ADMIN</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div class="logo">SCIENOVA ADMIN 🔒 SECRET</div>
<img id="adminPic" style="width:50px;height:50px;border-radius:50%;display:none">
<input type="file" id="adminPicInput" accept="image/*"><button onclick="uploadAdminPic()">Upload Admin Profile Pic 📸</button>
<button onclick="logoutAdmin()">Logout</button></header>

<div id="loginBox"><h2>Enter Access Code</h2>
<input id="adminPass" type="password" placeholder="Access Code">
<button onclick="adminLogin()">Unlock Dashboard</button><p id="adminMsg"></p></div>

<div id="adminPanel" style="display:none">
  <h2>Admin Profile</h2><p>Name: SCIENOVA Admin | Email: admin@scienova.ug | Phone: 0761234567</p>
  <button onclick="changeAdminPass()">Change Access Code</button>
  <div id="stats"></div>
  <button onclick="showTab('weekly')">Weekly Payments</button>
  <button onclick="showTab('monthly')">Monthly Payments</button>
  <button onclick="showTab('walletTx')">Wallet Transactions</button>
  <button onclick="showTab('users')">Users - Search by Phone</button>
  <button onclick="showTab('adminOnly')">🔒 Admin-Only Papers</button>
  <div id="loadingBar" style="display:none">Loading... <span id="loadPct">0%</span></div>
  <input id="searchPhone" placeholder="Search by phone 076..." oninput="searchByPhone(this.value)">
  <div id="tabContent"></div>

  <h3>🔒 Admin-Only Add Paper - Others CANNOT Tamper</h3>
  <p>Locked papers: Only Admin can Edit/Delete. Contributors cannot tamper.</p>
  <input id="adminTitle" placeholder="Title">
  <select id="adminSubject"><option>Biology</option><option>Chemistry</option><option>Physics</option><option>Mathematics</option></select>
  <input id="adminLevel" placeholder="Level S.4">
  <input id="adminPrice" placeholder="Price UGX">
  <input type="file" id="adminFile">
  <label><input type="checkbox" id="adminLock" checked> Lock this paper - No one can edit except Admin</label>
  <button onclick="addAdminPaper()">Add Paper Securely - LOCKED 🔒</button>
  <div id="adminPapers"></div>

  <h3>Announcements</h3><textarea id="announceText"></textarea><button onclick="sendAnnouncement()">Send Announcement</button>
  <button onclick="exportExcel()">Export Payments to Excel (CSV)</button>
  <button onclick="backupData()">Backup Data</button>
</div>
<script src="admin.js"></script>
</body></html>
